<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <style>
    * { box-sizing: border-box; }
    body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #121212; font-family: sans-serif; }
    .calc { width: 320px; background: #1e1e1e; border-radius: 16px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    #display { width: 100%; height: 60px; background: #2a2a2a; border: none; border-radius: 8px; color: #fff; font-size: 28px; text-align: right; padding: 10px; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    button { height: 55px; border-radius: 8px; border: none; font-size: 20px; background: #333; color: white; cursor: pointer; }
    button.op { background: #ff9500; color: white; }
    button.clear { background: #d9534f; }
  </style>
</head>
<body>
  <div class="calc">
    <input type="text" id="display" readonly>
    <div class="grid">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button onclick="del()">DEL</button>
      <button class="op" onclick="append('%')">%</button>
      <button class="op" onclick="append('/')">÷</button>
      <button onclick="append('7')">7</button>
      <button onclick="append('8')">8</button>
      <button onclick="append('9')">9</button>
      <button class="op" onclick="append('*')">×</button>
      <button onclick="append('4')">4</button>
      <button onclick="append('5')">5</button>
      <button onclick="append('6')">6</button>
      <button class="op" onclick="append('-')">-</button>
      <button onclick="append('1')">1</button>
      <button onclick="append('2')">2</button>
      <button onclick="append('3')">3</button>
      <button class="op" onclick="append('+')">+</button>
      <button onclick="append('0')">0</button>
      <button onclick="append('.')">.</button>
      <button class="op" style="grid-column: span 2;" onclick="calc()">=</button>
    </div>
  </div>
  <script>
    const d = document.getElementById('display');
    function append(val) { d.value += val; }
    function clearDisplay() { d.value = ''; }
    function del() { d.value = d.value.slice(0, -1); }
    function calc() { try { d.value = eval(d.value); } catch { d.value = 'Error'; } }
  </script>
</body>
</html>
