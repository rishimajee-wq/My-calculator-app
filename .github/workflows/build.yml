name: Build Signed Calculator APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova & Build Signed Release APK
        run: |
          npm install -g cordova
          cordova create calcApp com.rishimajee.calculator Calculator
          cd calcApp
          rm -rf www/*
          cp -r ../index.html www/
          cordova platform add android
          
          # ডিজিটাল সিকিউরিটি কি তৈরি
          keytool -genkey -v -keystore my-release-key.keystore -alias my-key-alias -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Rishi, OU=Apps, O=Personal, L=City, S=State, C=IN"
          
          # রিলিজ APK বিল্ড
          cordova build android --release
          
          # APK সাইন করা
          cd platforms/android/app/build/outputs/apk/release/
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore ../../../../../../my-release-key.keystore -storepass 123456 app-release-unsigned.apk my-key-alias
          $ANDROID_SDK_ROOT/build-tools/34.0.0/zipalign -v 4 app-release-unsigned.apk Calculator-Signed.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-Signed-APK
          path: calcApp/platforms/android/app/build/outputs/apk/release/Calculator-Signed.apk
          
